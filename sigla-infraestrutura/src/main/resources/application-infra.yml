spring:
  datasource:
    url: ${SIGLA_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sigla}}
    username: ${SIGLA_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:sigla}}
    password: ${SIGLA_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:sigla}}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

sigla:
  armazenamento:
    attachment-root: var/attachments
  notificacoes:
    webhook:
      url: ${SIGLA_NOTIFICACOES_WEBHOOK_URL:https://webhookn8n.lero.pro/webhook/sigla-notificacoes}
      token: ${SIGLA_NOTIFICACOES_WEBHOOK_TOKEN:}
    whatsapp:
      enabled: ${SIGLA_NOTIFICACOES_WHATSAPP_ENABLED:true}
    modo-teste: ${SIGLA_NOTIFICACOES_MODO_TESTE:false}
    hora-envio-padrao: ${SIGLA_NOTIFICACOES_HORA_ENVIO:8}
